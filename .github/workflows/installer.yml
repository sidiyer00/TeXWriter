# Builds the Windows installer (release/Quire-Setup-<version>.exe) on a Windows runner.
# Every push and pull request: the installer is attached to the run as an artifact
# (Actions → the run → Artifacts). A push to main (or a tag v<version>) also publishes it
# as the GitHub Release v<version> from package.json — the download link to give people.
# Bump "version" in package.json for a new release; pushes without a bump refresh the
# installer on the existing release.
name: Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }

      - run: npm ci

      - run: npm test

      # typecheck + main + renderer build, then electron-builder --win nsis (unsigned)
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test - silent install and launch check
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Quire-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Quire.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Quire.exe was not installed' }
          Write-Host "Installed: $($exe.FullName)"
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'resources\resources\sample\report.tex'))) { throw 'Sample project resources missing from the install' }

      - uses: actions/upload-artifact@v4
        with:
          name: Quire-Setup-${{ github.sha }}
          path: release/Quire-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Release version
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quire ${{ steps.ver.outputs.tag }}
          files: release/Quire-Setup-*.exe
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
          body: |
            **Install:** download `Quire-Setup-*.exe` below and run it. It installs for your user (no admin rights) and adds Quire to the Start menu.
            The installer is unsigned: if Windows SmartScreen warns, choose **More info → Run anyway**.
            To compile PDFs, also install MiKTeX or TeX Live; the sample test suite needs Python 3.9+.
